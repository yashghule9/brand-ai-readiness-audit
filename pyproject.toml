[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "braiaudit"
version = "0.1.0"
description = "Brand AI Readiness Audit — reference implementation of the brand-ai-readiness-audit Claude Agent Skill set."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "Yash Ghule", email = "ecgenius.life@gmail.com" }
]
keywords = ["ai-readiness", "crawler", "audit", "claude-skills", "seo", "llm"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
  "requests>=2.31",
  "beautifulsoup4>=4.12",
  "PyYAML>=6.0",
  "jsonschema>=4.20",
]

[project.optional-dependencies]
render = ["playwright>=1.40"]
dev = [
  "pytest>=8.0",
  "responses>=0.25",
  "ruff>=0.5",
]

[project.urls]
Homepage = "https://github.com/example/brand-ai-readiness-audit"
Issues = "https://github.com/example/brand-ai-readiness-audit/issues"

[project.scripts]
braiaudit = "braiaudit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
braiaudit = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
