name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: lint, type-check schemas, and test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install braiaudit (editable) + dev deps
        run: pip install -e ".[dev]"

      - name: Ruff lint
        run: ruff check src tests tools

      - name: Lint SKILL.md files, marketplace.json, and ontology.yaml
        run: python tools/lint_skills.py

      - name: Validate marketplace.json against its schema
        run: python -m braiaudit.cli validate marketplace.json --schema marketplace

      - name: pytest
        run: pytest -q

  render-extra-smoke:
    name: optional render extra installs cleanly
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install braiaudit[render]
        run: pip install -e ".[render,dev]"
      - name: Playwright reports itself available (browser binaries not installed in CI)
        run: python -c "from braiaudit import render; assert render.is_available()"
      - name: pytest still passes with the render backend importable
        run: pytest -q
